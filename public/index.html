<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>StockSense - Inventory Management System</title><link rel="stylesheet" href="style.css"></head><body><div class="sidebar"><h2>StockSense IMS</h2><a href="#" onclick="switchTab('dashboard')" class="active">Dashboard</a><a href="#" onclick="switchTab('products')">Products</a><a href="#" onclick="switchTab('receipts')">Receipts (Incoming)</a><a href="#" onclick="switchTab('profile')">My Profile</a></div><div class="main-content"><div id="dashboard-tab" class="tab-content"><h1>Dashboard KPIs</h1><div class="kpi-container"><div class="kpi-card"><h3>Total Products</h3><p id="kpi-total">0</p></div><div class="kpi-card"><h3>Low Stock Items</h3><p id="kpi-low">0</p></div></div><h2>Current Inventory Stock</h2><table id="inventory-table"><thead><tr><th>Name</th><th>SKU</th><th>Category</th><th>UoM</th><th>Stock</th></tr></thead><tbody></tbody></table></div><div id="products-tab" class="tab-content" style="display:none;"><h1>Product Management</h1><form id="product-form"><input type="text" id="p-name" placeholder="Product Name" required><input type="text" id="p-sku" placeholder="SKU / Code" required><input type="text" id="p-category" placeholder="Category" required><input type="text" id="p-uom" placeholder="Unit of Measure (e.g., kg, units)" required><input type="number" id="p-stock" placeholder="Initial Stock" value="0"><button type="submit">Create Product</button></form></div><div id="receipts-tab" class="tab-content" style="display:none;"><h1>Receipts (Incoming Goods)</h1><form id="receipt-form"><input type="text" id="r-supplier" placeholder="Supplier Name" required><input type="text" id="r-sku" placeholder="Product SKU" required><input type="number" id="r-qty" placeholder="Quantity Received" required><button type="submit">Validate Receipt & Update Stock</button></form><p id="receipt-msg"></p></div><div id="profile-tab" class="tab-content" style="display:none;"><h1>My Profile</h1><p>Role: Inventory Manager</p><p>Status: Active</p></div></div><script src="app.js"></script></body></html>
